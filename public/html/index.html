<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Dispositivos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Control de Dispositivos</h1>
        
        <div class="section">
            <h2>Agregar Dispositivo</h2>
            <form id="deviceForm">
                <input type="text" id="deviceName" placeholder="Nombre del dispositivo" required>
                <input type="text" id="deviceDescription" placeholder="Descripción" required>
                <select id="deviceStatus">
                    <option value="inactive">Inactivo</option>
                    <option value="active">Activo</option>
                </select>
                <button type="submit">Agregar Dispositivo</button>
            </form>
        </div>

        <div class="section">
            <h2>Dispositivos</h2>
            <div id="devicesList"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
